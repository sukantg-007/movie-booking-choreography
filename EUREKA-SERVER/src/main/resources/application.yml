server:
  port: 8761
spring:
  application:
    name: EUREKA-SERVER
  output:
    ansi:
      enabled: ALWAYS
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone : http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false
    # Eviction frequency for dead service instances (every 5 seconds)
    eviction-interval-timer-in-ms: 5000
    
management:
  endpoints:
    web:
      exposure:
        include: health, info